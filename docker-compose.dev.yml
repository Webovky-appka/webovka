services:
  postgres:
    image: postgres:17-alpine
    container_name: web-appka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webappka
      POSTGRES_PASSWORD: webappka
      POSTGRES_DB: webappka
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webappka -d webappka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
