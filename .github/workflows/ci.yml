name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Kontroly se k databázi nepřipojují, Prisma ale vyžaduje platný tvar URL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-only-not-a-real-secret
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bez vygenerovaného klienta neprojde typecheck ani build.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
