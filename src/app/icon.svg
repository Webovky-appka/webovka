<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mitsov Web">
  <title>Mitsov Web</title>
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <!--
    M vedené jako střecha a dva sloupy: nástroj na stavbu webů. Kreslené tahy,
    ne text — ikona se nemůže spoléhat na to, že bude po ruce font.
  -->
  <path
    d="M13 44V20l19 14 19-14v24"
    fill="none"
    stroke="#f8fafc"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!--
    Oranžové s pod vrcholem M dělá z monogramu Mitsov. Na 16 px se z něj stane
    jen akcent, což je přesně to, čím byla dřív tečka.
  -->
  <path
    d="M37 40c-3-2.5-10-2-10 1.5s10 2.5 10 6-7 4-10 1.5"
    fill="none"
    stroke="#f59e0b"
    stroke-width="4.5"
    stroke-linecap="round"
  />
</svg>
